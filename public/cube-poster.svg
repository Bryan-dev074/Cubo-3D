    <filter id="cube-depth" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1d252b" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="960" height="720" fill="#f8f8f7"/>

