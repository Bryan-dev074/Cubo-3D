<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Vista previa del Cubo Mágico 3D</title>
  <desc id="description">Cubo de 26 piezas en vista de tres cuartos, apoyado sobre un plano de empaque desplegado.</desc>
  <defs>
