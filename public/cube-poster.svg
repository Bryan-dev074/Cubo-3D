    <g data-face="front" transform="matrix(.88 .487 0 .903 216 236)" fill="#145bc5" stroke="#111416" stroke-width="13">
      <rect x="7" y="7" width="86" height="86" rx="11"/>
      <rect x="107" y="7" width="86" height="86" rx="11"/>
      <rect x="207" y="7" width="86" height="86" rx="11"/>
      <rect x="7" y="107" width="86" height="86" rx="11"/>
