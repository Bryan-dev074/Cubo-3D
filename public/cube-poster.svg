<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Vista previa del Cubo Mágico 3D</title>
  <desc id="description">Cubo de colores con piezas negras redondeadas sobre un fondo de estudio claro.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafb"/>
      <stop offset="1" stop-color="#dfe5e9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#background)"/>
  <ellipse cx="500" cy="590" rx="260" ry="62" fill="#17202a" opacity=".18" filter="url(#shadow)"/>
  <g transform="translate(480 345) rotate(-30) skewX(7)">
    <rect x="-232" y="-232" width="464" height="464" rx="52" fill="#111417"/>
    <g stroke="#111417" stroke-width="16">
      <rect x="-216" y="-216" width="132" height="132" rx="28" fill="#f23b30"/>
      <rect x="-66" y="-216" width="132" height="132" rx="28" fill="#f28b22"/>
      <rect x="84" y="-216" width="132" height="132" rx="28" fill="#f2f2ee"/>
      <rect x="-216" y="-66" width="132" height="132" rx="28" fill="#2f8a4a"/>
      <rect x="-66" y="-66" width="132" height="132" rx="28" fill="#f5c518"/>
      <rect x="84" y="-66" width="132" height="132" rx="28" fill="#1559d6"/>
      <rect x="-216" y="84" width="132" height="132" rx="28" fill="#1559d6"/>
      <rect x="-66" y="84" width="132" height="132" rx="28" fill="#f2f2ee"/>
      <rect x="84" y="84" width="132" height="132" rx="28" fill="#f23b30"/>
    </g>
  </g>
</svg>
