<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Vista previa del Cubo Mágico 3D</title>
  <desc id="description">Cubo de 26 piezas en vista de tres cuartos, apoyado sobre un plano de empaque desplegado.</desc>
  <defs>
    <filter id="contact-shadow" x="-35%" y="-120%" width="170%" height="340%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="cube-depth" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#11181d" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="960" height="720" fill="#edf1f3"/>

  <g data-surface="unfolded-plan" fill="none" stroke="#829099" stroke-width="1.5" opacity=".42">
    <path d="M58 468 212 379 342 411 464 301 690 323 856 446 771 607 545 574 434 666 269 592 112 628Z" stroke-dasharray="9 10"/>
    <path d="M212 379 269 592M342 411 434 666M464 301 545 574M690 323 771 607" stroke-dasharray="9 10"/>
    <path d="M112 628 58 468 24 488 48 602ZM771 607 856 446 914 484 867 584Z"/>
    <circle cx="73" cy="90" r="9"/>
    <path d="M73 61v58M44 90h58"/>
    <circle cx="872" cy="102" r="9"/>
    <path d="M872 73v58M843 102h58"/>
  </g>

  <path d="M92 155h126" stroke="#0f4fd4" stroke-width="8"/>
  <path d="M742 641h126" stroke="#0f4fd4" stroke-width="8"/>
  <ellipse cx="493" cy="603" rx="245" ry="39" fill="#172027" opacity=".22" filter="url(#contact-shadow)"/>

  <g filter="url(#cube-depth)">
    <path d="M480 90 744 236 480 382 216 236Z" fill="#111416"/>
    <path d="M216 236 480 382 480 653 216 507Z" fill="#0d1012"/>
